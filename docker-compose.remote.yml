version: '3.8'

# 🚀 VERIZON CLASS ACTION - DOCKER COMPOSE REMOTO
# Configuración completa para servidor de producción

services:
  # 🌐 Reverse Proxy y SSL Termination
  caddy:
    image: caddy:2-alpine
    container_name: verizon_caddy
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"  # Admin API
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./static:/srv:ro
      - ./logs/caddy:/var/log/caddy
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    networks:
      - verizon_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🔧 API Backend
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: verizon_api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - DOMAIN=${DOMAIN}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=verizonunlock
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - EXPORT_SECRET=${EXPORT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
    volumes:
      - ./data:/app/data
      - ./logs/api:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verizon_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # 🗄️ Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: verizon_postgres
    environment:
      - POSTGRES_DB=verizonunlock
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - verizon_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d verizonunlock"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # 📦 Cache Redis
  redis:
    image: redis:7-alpine
    container_name: verizon_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks:
      - verizon_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 📧 Email Worker
  email-worker:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: verizon_email_worker
    command: ["node", "workers/email-worker.js"]
    environment:
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=verizonunlock
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./logs/email:/app/logs
      - ./templates:/app/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verizon_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 📊 Analytics Worker
  analytics-worker:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: verizon_analytics
    command: ["node", "workers/analytics-worker.js"]
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=verizonunlock
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs/analytics:/app/logs
      - ./data/analytics:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verizon_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 🔍 Test Results Processor
  test-processor:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: verizon_test_processor
    command: ["node", "workers/test-processor.js"]
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=verizonunlock
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./test_results:/app/test_results:ro
      - ./logs/tests:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verizon_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 📈 Monitoring con Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: verizon_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - verizon_net
    restart: unless-stopped

  # 📊 Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: verizon_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - verizon_net
    restart: unless-stopped

  # 🛡️ Security Scanner
  security-scanner:
    build:
      context: ./security
      dockerfile: Dockerfile
    container_name: verizon_security
    environment:
      - SCAN_INTERVAL=${SCAN_INTERVAL:-3600}
      - ALERT_WEBHOOK=${SECURITY_WEBHOOK}
    volumes:
      - ./logs/security:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - verizon_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # 🔄 Backup Service
  backup:
    image: postgres:15-alpine
    container_name: verizon_backup
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: ["sh", "-c", "apk add --no-cache dcron && echo '${BACKUP_SCHEDULE:-0 2 * * *} /backup.sh' | crontab - && crond -f"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verizon_net
    restart: unless-stopped

# 🌐 Networks
networks:
  verizon_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 💾 Volumes
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 🏷️ Labels para organización
x-labels: &default-labels
  project: "verizon-class-action"
  environment: "production"
  maintainer: "legal@verizonunlock.org"
